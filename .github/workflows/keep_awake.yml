# Streamlit Community Cloud는 접속이 없으면 앱을 재운다. 단순 HTTP 요청은 방문으로 치지 않아서
# 실제 브라우저로 열고, 잠든 화면이면 깨우기 버튼을 누른다.
name: keep-awake

on:
  schedule:
    - cron: "17 */6 * * *"   # 6시간마다
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: 대시보드 열기
        env:
          APP_URL: https://voc-lens.streamlit.app/
        run: |
          python - <<'EOF'
          import os
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              page = p.chromium.launch().new_page()
              page.goto(os.environ["APP_URL"], wait_until="networkidle", timeout=90_000)
              wake = page.get_by_role("button", name="Yes, get this app back up!")
              if wake.count():
                  print("잠든 상태 → 깨우기")
                  wake.click()
                  page.wait_for_timeout(60_000)
              else:
                  print("깨어 있음")
                  page.wait_for_timeout(15_000)
          EOF
