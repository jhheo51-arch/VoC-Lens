# 영상 분석 설정 v0.1

# 불만 분류 기준 도메인 (delivery | product). 번들 meta.domain이 있으면 그쪽을 쓴다.
# 비워 두면 배달·제품 기준이 함께 적용되어 휴대폰 리뷰에 '배달 지연' 같은 라벨이 붙는다 (실제 영상에서 확인).
domain: product

# 영상 유형: 제목·설명·태그·자막 앞부분에서 키워드 점수로 분류한다.
# 유형마다 해석 기준이 다르다 (예: 리뷰 유튜버는 평소 텐션이 높아 각성이 과대평가됨 → 화자 기준 정규화).
types:
  review:
    label: 리뷰·언박싱
    keywords: ['리뷰', '후기', '언박싱', '개봉기', '내돈내산', '장단점', '솔직', '비교', '사용기', '먹방', '시켜 먹', '시켜먹']
  vlog:
    label: 브이로그
    keywords: ['브이로그', 'vlog', 'VLOG', '일상', '하루', '데일리']
  interview:
    label: 인터뷰
    keywords: ['인터뷰', 'Q&A', '질문', '대담', '토크']
  call:
    label: 상담·응대 재연
    keywords: ['상담', '고객센터', '콜센터', '재연', '진상', '응대']
  news:
    label: 뉴스·정보
    keywords: ['뉴스', '보도', '정리', '총정리', '소식', '발표']
default_type: other
other_label: 기타

# 내용 구간 분할
segmentation:
  # 문장 몇 개씩 묶어 이웃 블록과 비교할지 (TextTiling의 블록 크기)
  block_size: 3
  # 유사도가 이웃보다 이만큼 깊게 패인 곳을 경계 후보로 본다
  depth_threshold: 0.15
  # 구간 최소 문장 수
  min_sentences: 3
  # 이 표현으로 시작하는 문장 앞은 경계로 본다
  cue_phrases: ['총평', '결론', '정리하자면', '정리하면', '장점은', '단점은', '아쉬운 점', '좋은 점', '먼저 언박싱', '개봉해', '가격은', '마지막으로', '오늘은', '자 그럼', '이제 실제로', '이제 먹어', '이제 써', '다만', '그리고 단점']

# 구간 이름: 구간 안 문장에서 키워드가 가장 많이 나온 이름을 붙인다
segment_labels:
  도입: ['안녕하세요', '오늘은', '구독', '소개해', '준비했']
  언박싱: ['언박싱', '개봉', '박스', '구성품', '포장']
  사용: ['써 보', '써보', '사용해', '먹어 보', '먹어보', '돌려 보', '틀어 보', '테스트', '맛은', '소리', '화면', '모드', '돌리면', '쓰면', '먹으면']
  장단점: ['장점', '단점', '아쉬운', '좋은 점', '불편', '단점은', '장점은']
  총평: ['총평', '결론', '정리하', '추천', '비추', '별점', '점수', '살 만', '재구매', '재주문']
default_segment_label: 본문

# 구독·좋아요 요청 같은 상투 문구는 제품 평가가 아니라서 분석에서 뺀다
boilerplate: ['구독', '좋아요\s?(와|랑|도)?\s?(구독|알림)', '좋아요 부탁', '알림 설정', '댓글로 남겨', '댓글 남겨', '끝까지 봐', '영상 끝까지']

# 총평 구간은 시청자 인식에 큰 영향을 주므로 영상 전체 평가에서 가중치를 더 준다
verdict_weight: 2.0

# 말과 톤의 불일치: 텍스트는 긍정인데 음성 각성이 이보다 낮으면 "말은 긍정, 톤은 저활력"으로 표시
mismatch:
  text_valence_min: 0.3
  audio_arousal_max: 0.3

# 댓글
comments:
  max_comments: 500
  # 타임스탬프 댓글을 구간에 연결할 때 앞뒤 여유(초)
  timestamp_tolerance_sec: 5
