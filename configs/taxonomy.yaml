# VoC 불만 유형 분류 기준 v0.3 (배달·제품 도메인)
#
# 각 소분류의 필드
#   category   대분류
#   aspect     속성 (속성별 감성 집계에 사용)
#   stage      고객 여정 단계 (journey_stages.yaml의 단계 이름)
#   difficulty 실행 난이도 1(낮음)~3(높음). 개선 과제 우선순위 4분면에 사용
#   complaint  이 표현이 나오면 감정과 상관없이 불만으로 본다 (정규식)
#   topic      주제만 나타내는 표현. 절의 Valence가 음수일 때만 불만으로 본다 (정규식)
#   seeds      대표 문장. 2주차 임베딩 Zero-shot 분류에 쓴다
#   domains    이 소분류를 쓰는 도메인 (delivery, product). 없으면 모든 도메인
#
# 기준을 고치면 docs/voc_taxonomy.md의 개정 이력에 남긴다.

