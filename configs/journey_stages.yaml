# 고객 여정 단계 (배달 도메인)
# 절에 불만 유형이 붙으면 taxonomy.yaml의 stage를 쓰고,
# 불만 유형이 없으면 아래 키워드로 단계를 추정한다. 순서가 앞일수록 우선한다.

domain: delivery
stages:
  - name: 탐색
    keywords: ['메뉴 고르', '리뷰 보고', '처음 시켜', '처음 주문', '사진 보고']
  - name: 주문·결제
    keywords: ['주문할 때', '결제', '쿠폰', '배달비', '배달팁']
  - name: 조리·포장
    keywords: ['포장', '요청사항', '조리']
  - name: 배달
    keywords: ['배달', '도착', '기사님', '라이더', '빨리 왔', '금방 왔']
  - name: 수령·섭취
    keywords: ['맛', '양', '먹', '바삭', '촉촉', '따뜻', '신선', '식었']
  - name: 문의·환불
    keywords: ['환불', '전화', '문의', '사장님', '답글', '고객센터']
  - name: 재주문
    keywords: ['재주문', '또 시킬', '또 주문', '단골', '다음에도', '자주 시켜']
