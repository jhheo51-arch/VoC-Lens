# 상담 대화 표현 사전 v0.1
# 화자 역할 판정, 대화 역학 지표, 통화 결과 판정, 회복 계기 분석에 쓴다.

# 상담원 발화에 자주 나오는 표현 (역할 판정 점수 +1)
agent_script:
  - '(센터|고객센터|상담원|상담사)\s*\S{0,6}\s*(입니다|이에요)'
  - '무엇을 도와'
  - '도와\s?드릴까요'
  - '고객님'
  - '확인해\s?드리'
  - '확인\s?(중|하고 있)'
  - '잠시만 기다려\s?주'
  - '안내해\s?드리'
  - '처리해\s?드리'
  - '접수(해\s?드리|되었습니다|됐습니다)'
  - '양해 부탁'
  - '더 궁금하신'

# 고객 발화에 자주 나오는 표현 (역할 판정 점수 -0.5)
customer_cue:
  - '주문했는데'
  - '시켰는데'
  - '왜\s'
  - '언제\s?(와|오|돼)'
  - '환불(해\s?주|받)'
  - '몇 번'
  - '했거든요'
  - '아니\s'

# 공감·사과 (회복 계기 후보)
empathy:
  - '불편을 드려'
  - '죄송합니다'
  - '죄송해요'
  - '사과\s?(드립|드려)'
  - '(충분히\s?)?이해(합니다|해요|가 됩니다)'
  - '많이 (기다리|불편|속상)'

# 해결 조치 (회복 계기 후보, 통화 결과 = 해결)
resolution:
  - '처리(되었|됐|해\s?드렸)'
  - '(환불|취소|재발송)(이)?\s?(완료|진행|처리)'
  - '다시 보내\s?드리'
  - '재발송'
  - '쿠폰(을)?\s?(지급|발급|넣어)'
  - '접수(되었|됐)습니다'
  - '바로 (출발|조리|보내)'

# 다른 부서로 넘김 (통화 결과 = 이관)
transfer:
  - '다른 부서'
  - '담당\s?부서'
  - '(담당자|부서)(로|에)?\s?연결'
  - '이관'
  - '해당 (매장|가게)(으로|에)? (직접\s?)?문의'

# 해결 보류 (통화 결과 = 보류)
pending:
  - '확인 후\s?(다시\s?)?(연락|안내|전화)'
  - '다시 연락\s?드리'
  - '회신\s?(드리|해\s?드리)'
  - '(결과|처리)는\s?.{0,6}(문자|연락)'
