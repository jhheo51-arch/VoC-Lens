# CX 신호 사전 v0.1
# 신호마다 정규식 목록. exclude에 걸리면 그 신호는 무시한다.

signals:
  repurchase_intent:
    patterns: ['재주문', '또 시킬', '또 시켜', '또 주문', '단골', '다음에도 시', '다음에 또', '자주 시켜', '재구매', '또 올게', '또 먹을']
    exclude: ['재주문 안', '재주문은 안', '재주문 의사 없', '또 시킬 일 없', '면 재주문', '면 또 시']
  churn_intent:
    patterns: ['다신 안', '다시는 안', '두 번 다시', '다시 시킬 일', '앱 삭제', '탈퇴', '다른 (가게|곳|데|지점|매장)(에서|로)', '재주문 안', '재주문은 안', '재주문 의사 없', '또 시킬 일 없', '마지막 주문']
    exclude: []
  recommend_intent:
    patterns: ['추천', '강추', '꼭 드셔', '꼭 시켜', '드셔 보세요']
    exclude: ['비추', '추천 안', '추천은 안', '추천 못', '추천은 못', '추천하지 않']
  not_recommend:
    patterns: ['비추', '추천 안', '추천은 안', '추천 못', '추천은 못', '추천하지 않', '시키지 마세요', '시키지 마']
    exclude: []
  repeat_contact:
    patterns: ['몇 번', '여러 번', '또 전화', '또 연락', '계속 전화', '계속 연락', '\d+\s*번(이나|째)', '두 번이나', '세 번이나', '전화를 안 받', '전화 안 받', '연락이 안']
    exclude: []
  waiting:
    patterns: ['기다리', '기다렸', '한참', '아직도', '\d+\s*시간', '한\s?시간', '[4-9]\d\s*분', '오래 걸']
    exclude: []
  resolution:
    patterns: ['다시 보내', '다시 만들어', '재조리', '환불해 주', '환불해주', '환불 받았', '바로 처리', '바로 해결', '해결해 주', '해결해주', '챙겨 주', '챙겨주']
    exclude: ['환불해 주지 않', '해결해 주지 않']
  apology_received:
    patterns: ['사과(를|도)? (받|하셨|해 주|해주)', '사장님이 사과', '죄송하다고', '사과 전화']
    exclude: []
