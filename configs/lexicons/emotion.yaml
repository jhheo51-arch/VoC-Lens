# 감정 표현 바로 앞에 오면 가중치를 1.5배로
intensifiers: ['너무', '진짜', '정말', '완전', '엄청', '겁나', '개', '매우', '아주']

# 부정 표현("안 좋아요", "좋지 않", "추천 안 함")은 text/emotion.py의 정규식으로 찾는다.

# 뒤집힌 표현의 가중치가 옮겨 가는 감정과 비율
flip_positive_to: [슬픔, 0.8]
flip_negative_to: [기쁨, 0.5]

# 감정이 하나도 안 잡힐 때의 기본 점수 (확률 정규화 시 분모에 들어감)
neutral_score: 1.0

# Circumplex 좌표 (Valence -1~1, Arousal 0~1)
circumplex:
  기쁨: [0.80, 0.60]
  슬픔: [-0.70, 0.25]
  분노: [-0.70, 0.85]
  불안: [-0.60, 0.70]
  놀람: [0.10, 0.85]
  혐오: [-0.75, 0.55]
  중립: [0.00, 0.30]
